<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cotizaciones Pendientes</title>
  <style>
    body { font-family: Arial; margin: 20px; background-color: purple; color: white; }
    button.volver { background: #4B0082; color: white; border: none; padding: 8px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: #7c007c; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #4B0082; }
    tbody tr:hover { background: #9f009f; cursor: pointer; font-weight: bold; }
    .no-data { margin-top: 20px; color: #ffd966; font-size: 18px; }
  </style>
</head>
<body>
  <button class="volver" onclick="window.location.href='bienvenida.html'">← Menú Principal</button>
  <h2>Cotizaciones Pendientes</h2>
  <div id="mensaje" class="no-data" style="display:none;">No hay refacciones pendientes de cotizar.</div>

  <table id="tablaPendientes">
    <thead>
      <tr>
        <th>ID</th>
        <th>MFG</th>
        <th>Descripción</th>
        <th>Solicitante</th>
        <th>No. Parte</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function cargar() {
      const tbody = document.querySelector("#tablaPendientes tbody");
      const mensaje = document.getElementById("mensaje");
      const tabla = document.getElementById("tablaPendientes");
      
      try {
        const res = await fetch("http://127.0.0.1:8000/api/pendientes_cotizacion/");
        const data = await res.json();

        if (data.length === 0) {
          tabla.style.display = "none";
          mensaje.style.display = "block";
          return;
        }

        data.forEach(r => {
          const tr = document.createElement("tr");
          tr.onclick = () => {
            localStorage.setItem("cotizacion_id", r.id);
            window.location.href = "detalle_cotizacion.html";
          };
          tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.numero_mfg}</td>
            <td>${r.descripcion}</td>
            <td>${r.nombre_solicitante}</td>
            <td>${r.numero_parte_proveedor}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) { alert("Error: " + err.message); }
    }
    cargar();
  </script>
</body>
</html>
