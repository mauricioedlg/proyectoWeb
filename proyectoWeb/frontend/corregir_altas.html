<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Corregir Mis Altas</title>

  <style>
    body {
      font-family: Arial;
      margin: 20px;
      background-color: purple;
      color: white;
    }
    header {
      margin-bottom: 20px;
    }
    button.volver {
      background: #4B0082;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.volver:hover {
      background: #360062;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #7c007c;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background: #4B0082;
    }
    tr:hover {
      background: #9f009f;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <button class="volver" onclick="window.location.href='bienvenida.html'">← Menú Principal</button>
  </header>

  <h2>Corregir Mis Altas</h2>

  <table id="tabla">
    <thead>
      <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>Número Parte</th>
        <th>Marca</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  async function cargar() {
    const usuarioId = localStorage.getItem("usuarioId");

    const res = await fetch(`http://127.0.0.1:8000/api/mis_refacciones/${usuarioId}/`);
    const data = await res.json();

    const tbody = document.querySelector("#tabla tbody");
    tbody.innerHTML = "";

    data.forEach(r => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${r.id}</td>
        <td>${r.descripcion}</td>
        <td>${r.numero_parte_proveedor}</td>
        <td>${r.marca_proveedor}</td>
      `;

      tr.onclick = () => {
        // Guardar ID en localStorage
        localStorage.setItem("editar_id", r.id);
        window.location.href = "editar_refaccion.html";
      };

      tbody.appendChild(tr);
    });
  }

  cargar();
</script>

</body>
</html>
