<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle Aprobación</title>
  <style>
    body {
      font-family: Arial;
      margin: 30px;
      background-color: purple;
      color: white;
    }
    .card {
      background: #4B0082;
      padding: 30px;
      border-radius: 8px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #ffd966;
      border-bottom: 2px solid #660066;
      padding-bottom: 10px;
    }
    ul {
      list-style-type: disc;
      padding-left: 20px;
      font-size: 18px;
      line-height: 1.6;
    }
    li strong { color: #e0e0e0; }
    .botones-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    button {
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-aprobar {
      background-color: #28a745;
      color: white;
    }
    .btn-aprobar:hover { background-color: #218838; }

    .btn-rechazar {
      background-color: #dc3545;
      color: white;
    }
    .btn-rechazar:hover { background-color: #c82333; }

    .btn-volver {
      background-color: #6c757d;
      color: white;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <button class="btn-volver" onclick="window.location.href='aprobaciones_pendientes.html'">← Volver</button>

  <div class="card">
    <h1 id="tituloDescripcion">Cargando...</h1>

    <ul id="listaDetalles"></ul>

    <div class="botones-container">
      <button class="btn-aprobar" onclick="gestionar('SI')">✅ Aprobar</button>
      <button class="btn-rechazar" onclick="gestionar('NO')">❌ Rechazar</button>
    </div>
  </div>

  <script>
    const id = localStorage.getItem("aprobacion_id");
    const rol = localStorage.getItem('descripcionRol');

    if (!id) {
      alert("No se seleccionó ningún registro.");
      window.location.href = 'aprobaciones_pendientes.html';
    }

    async function cargarDetalle() {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/refaccion/${id}/`);
        const data = await res.json();

        document.getElementById("tituloDescripcion").textContent = data.descripcion || "Sin descripción";

        const ul = document.getElementById("listaDetalles");
        ul.innerHTML = `
          <li><strong>ID:</strong> ${data.id}</li>
          <li><strong>Solicitado por:</strong> ${data.nombre_solicitante || 'Desconocido'}</li>
          <li><strong>Aprobación Mtto:</strong> ${data.aprobacion_mtto}</li>
          <li><strong>Número de Parte:</strong> ${data.numero_parte_proveedor}</li>
          <li><strong>Marca:</strong> ${data.marca_proveedor || 'N/A'}</li>
          <li><strong>Familia:</strong> ${data.familia || 'N/A'}</li>
          <li><strong>Área:</strong> ${data.area || 'N/A'}</li>
          <li><strong>Costo:</strong> $${data.costo || 0}</li>
          <li><strong>Consumo:</strong> ${data.consumo || 'N/A'}</li>
          <li><strong>Frecuencia:</strong> ${data.frecuencia || 'N/A'}</li>
          <li><strong>Unidad:</strong> ${data.unidad || 'N/A'}</li>
          <li><strong>Cantidad:</strong> ${data.cantidad || 0}</li>
          <li><strong>Equipos a usar:</strong> ${data.equipos_a_usar || 'N/A'}</li>
          <li><strong>Justificación/Observación:</strong> ${data.observacion || 'N/A'}</li>
        `;

      } catch (err) {
        alert("Error al cargar detalle");
        console.error(err);
      }
    }

    async function gestionar(accion) {
      const confirmacion = confirm(`¿Confirmas que deseas ${accion === 'SI' ? 'APROBAR' : 'RECHAZAR'} este registro?`);
      if (!confirmacion) return;

      // DEFINE URL SEGUN ROL
      let urlApi = "";
      if (rol === 'Gerente Mantenimiento') {
          urlApi = `http://127.0.0.1:8000/api/gestionar_aprobacion/${id}/`;
      } else {
          urlApi = `http://127.0.0.1:8000/api/gestionar_aprobacion_planta/${id}/`;
      }

      try {
        const res = await fetch(urlApi, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accion: accion })
        });

        const respData = await res.json();

        if (res.ok) {
          alert(respData.mensaje);
          window.location.href = 'aprobaciones_pendientes.html';
        } else {
          alert("Error: " + respData.error);
        }
      } catch (err) {
        alert("Error de conexión");
      }
    }

    cargarDetalle();
  </script>

</body>
</html>
