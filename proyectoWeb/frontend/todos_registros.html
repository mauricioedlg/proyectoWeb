<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Todos los Registros</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 20px;
      background-color: purple;
      color: white;
    }
    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .volver {
      background: #4B0082;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
    .volver:hover {
      background: #360062;
    }

    .top-bar {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    #searchInput {
      padding: 8px;
      width: 300px;
      border-radius: 4px;
      border: none;
    }

    #btnExcel {
      padding: 8px 12px;
      background: #ffd966;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background-color: #800080;
    }

    th, td {
      border: 1px solid #cccccc55;
      padding: 8px;
      color: white;
    }

    th {
      background-color: #4B0082;
    }

    tr:nth-child(even) td {
      background-color: #7a007a;
    }

    tr:nth-child(odd) td {
      background-color: #8a008a;
    }

    .loader {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <button class="volver" onclick="window.location.href='bienvenida.html'">← Menú Principal</button>
    <h2>Todos los Registros</h2>
  </header>

  <div class="top-bar">
    <input id="searchInput" type="text" placeholder="Buscar por descripción o número de parte...">
    <button id="btnExcel" onclick="descargarExcelGlobal()">Descargar registros</button>
  </div>

  <div id="loader" class="loader">Cargando registros...</div>
  <table id="tablaRegistros">
    <thead>
      <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>Costo</th>
        <th>Área</th>
        <th>Consumo</th>
        <th>Frecuencia</th>
        <th>Unidad</th>
        <th>Cantidad</th>
        <th>Observación</th>
        <th>Número Parte</th>
        <th>Marca Proveedor</th>
        <th>Equipos a Usar</th>
        <th>Familia</th>
        <th>Reemplazable</th>
        <th>Reduce Velocidad</th>
        <th>Existe Riesgo</th>
        <th>Nacionalidad</th>
        <th>Página Web</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let registrosOriginal = [];

    async function cargarRegistrosGlobales() {
      const loader = document.getElementById("loader");
      const tbody = document.querySelector("#tablaRegistros tbody");

      tbody.innerHTML = "";
      loader.style.display = "block";

      const response = await fetch("http://127.0.0.1:8000/api/todas_refacciones/");
      const data = await response.json();

      registrosOriginal = data;
      loader.style.display = "none";

      mostrarTabla(registrosOriginal);
    }

    function mostrarTabla(lista) {
      const tbody = document.querySelector("#tablaRegistros tbody");
      tbody.innerHTML = "";

      lista.forEach(ref => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${ref.id}</td>
          <td>${ref.descripcion}</td>
          <td>${ref.costo}</td>
          <td>${ref.area}</td>
          <td>${ref.consumo}</td>
          <td>${ref.frecuencia}</td>
          <td>${ref.unidad}</td>
          <td>${ref.cantidad}</td>
          <td>${ref.observacion}</td>
          <td>${ref.numero_parte_proveedor}</td>
          <td>${ref.marca_proveedor}</td>
          <td>${ref.equipos_a_usar}</td>
          <td>${ref.familia}</td>
          <td>${ref.reemplazable}</td>
          <td>${ref.reduce_velocidad}</td>
          <td>${ref.existe_riesgo}</td>
          <td>${ref.nacionalidad}</td>
          <td>${ref.pagina_web ? `<a href="${ref.pagina_web}" target="_blank">Abrir</a>` : "N/A"}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById("searchInput").addEventListener("input", function () {
      const texto = this.value.toLowerCase();

      const filtrados = registrosOriginal.filter(ref =>
        (ref.descripcion || "").toLowerCase().includes(texto) ||
        (ref.numero_parte_proveedor || "").toLowerCase().includes(texto)
      );

      mostrarTabla(filtrados);
    });

    function descargarExcelGlobal() {
      window.open("http://127.0.0.1:8000/api/descargar_excel_global/");
    }

    cargarRegistrosGlobales();
  </script>
</body>
</html>
