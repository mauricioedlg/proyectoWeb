<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Refacción</title>

  <style>
    body { font-family: Arial; margin: 20px; background-color: purple; color: white; }
    button.volver { background: #4B0082; color: white; border: none; padding: 8px 12px; cursor: pointer; }
    button.volver:hover { background: #360062; }
    label { display: block; margin-top: 10px; }
    input, select { display: block; width: 300px; padding: 8px; margin-bottom: 12px; }
    button.guardar { display: block; margin-top: 20px; padding: 10px 20px; background: #4B0082; color: white; border: none; cursor: pointer; }
    button.guardar:hover { background: #360062; }
    .hidden { display: none; }
  </style>
</head>

<body>

  <button class="volver" onclick="window.location.href='corregir_altas.html'">← Regresar</button>

  <h2>Editar Refacción</h2>

  <form id="formEdit" enctype="multipart/form-data">
    <label>Descripción</label> <input id="descripcion" name="descripcion">
    <label>Costo</label> <input id="costo" name="costo" type="number" step="0.01">
    <label>Área</label> <input id="area" name="area">
    <label>Consumo</label> <input id="consumo" name="consumo">

    <label>Frecuencia</label>
    <select id="frecuencia" name="frecuencia">
      <option value="">Seleccione...</option>
      <option value="Diario">Diario</option><option value="Semanal">Semanal</option>
      <option value="Quincenal">Quincenal</option><option value="Mensual">Mensual</option>
      <option value="Bimestral">Bimestral</option><option value="Trimestral">Trimestral</option>
      <option value="Semestral">Semestral</option><option value="Anual">Anual</option>
    </select>

    <label>Unidad</label>
    <select id="unidad" name="unidad">
      <option value="">Seleccione...</option>
      <option value="PZ">PZ</option><option value="KG">KG</option><option value="LBS">LBS</option>
      <option value="ML">ML</option><option value="M">M</option><option value="L">L</option>
      <option value="G">G</option><option value="OZ">OZ</option>
    </select>

    <label>Cantidad</label> <input id="cantidad" name="cantidad" type="number">
    <label>Observación</label> <input id="observacion" name="observacion">
    <label>Número parte proveedor</label> <input id="numero_parte_proveedor" name="numero_parte_proveedor">
    <label>Marca proveedor</label> <input id="marca_proveedor" name="marca_proveedor">
    <label>Equipos a usar</label> <input id="equipos_a_usar" name="equipos_a_usar">

    <label>Familia</label>
    <select id="familia" name="familia" onchange="verificarFamilia()">
      <option value="">Seleccione...</option>
      <option value="Bombas">Bombas</option><option value="Válvulas">Válvulas</option>
      <option value="Maquinaria">Maquinaria</option><option value="Partes de Maquinaria">Partes de Maquinaria</option>
      <option value="Quimicos">Quimicos</option><option value="Lubricantes">Lubricantes</option>
      <option value="Filtros">Filtros</option><option value="Motor Electrico">Motor Electrico</option>
    </select>

    <div id="divPdf" class="hidden">
      <label style="color: yellow;">Cambiar Ficha Técnica (PDF)</label>
      <input type="file" id="archivo_pdf" name="archivo_pdf" accept=".pdf">
    </div>

    <label>Reemplazable</label>
    <select id="reemplazable" name="reemplazable">
      <option value="">Seleccione...</option><option value="SI">SI</option><option value="NO">NO</option>
    </select>

    <label>Reduce velocidad</label>
    <select id="reduce_velocidad" name="reduce_velocidad">
      <option value="">Seleccione...</option><option value="SI">SI</option><option value="NO">NO</option>
    </select>

    <label>Existe riesgo</label>
    <select id="existe_riesgo" name="existe_riesgo">
      <option value="">Seleccione...</option><option value="SI">SI</option><option value="NO">NO</option>
    </select>

    <label>Nacionalidad</label>
    <select id="nacionalidad" name="nacionalidad">
      <option value="">Seleccione...</option><option value="Nacional">Nacional</option><option value="Internacional">Internacional</option>
    </select>

    <label>Página web</label> <input id="pagina_web" name="pagina_web">

    <button class="guardar" type="submit">Guardar Cambios</button>

  </form>


<script>
  function verificarFamilia() {
    const familia = document.getElementById('familia').value;
    const divPdf = document.getElementById('divPdf');
    if (familia === 'Quimicos') {
      divPdf.style.display = 'block';
    } else {
      divPdf.style.display = 'none';
      // No borramos el valor aquí en edición, por si el usuario se equivocó al cambiar de dropdown
    }
  }

  async function cargarDatos() {
    const id = localStorage.getItem("editar_id");
    if(!id) return;

    const res = await fetch(`http://127.0.0.1:8000/api/refaccion/${id}/`);
    const r = await res.json();
    
    for (let campo in r) {
      if (document.getElementById(campo)) {
        document.getElementById(campo).value = r[campo] ?? "";
      }
    }
    // Verificar si mostramos el input de PDF al cargar
    verificarFamilia();
  }

  cargarDatos();

  document.getElementById('formEdit').addEventListener("submit", async e => {
    e.preventDefault();

    const id = localStorage.getItem("editar_id");

    // USAMOS FormData PARA SOPORTAR ARCHIVOS EN LA EDICIÓN
    const formData = new FormData(e.target);

    // Cambiamos a POST porque enviar archivos con PUT en HTML Forms es complejo
    const res = await fetch(`http://127.0.0.1:8000/api/refaccion/${id}/`, {
      method: "POST", 
      body: formData
    });

    const data = await res.json();
    alert(data.mensaje || data.error);

    if (res.ok) {
      window.location.href = "corregir_altas.html";
    }
  });
</script>

</body>
</html>
