<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asignar MFG</title>
  <style>
    body {
      font-family: Arial;
      margin: 30px;
      background-color: purple;
      color: white;
    }
    .card {
      background: #4B0082;
      padding: 30px;
      border-radius: 8px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #ffd966;
      border-bottom: 2px solid #660066;
      padding-bottom: 10px;
    }
    ul {
      list-style-type: disc;
      padding-left: 20px;
      font-size: 18px;
      line-height: 1.6;
    }
    li strong { color: #e0e0e0; }
    
    .input-container {
      margin-top: 30px;
      background: #360062;
      padding: 20px;
      border-radius: 8px;
    }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { 
      width: 95%; padding: 10px; font-size: 16px; 
      border-radius: 4px; border: none;
    }
    
    .botones-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-guardar {
      background-color: #ffd966;
      color: black;
    }
    .btn-guardar:hover { background-color: #e6c255; }

    .btn-volver {
      background-color: #6c757d;
      color: white;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <button class="btn-volver" onclick="window.location.href='asignacion_mfg.html'">← Volver</button>

  <div class="card">
    <h1 id="tituloDescripcion">Cargando...</h1>

    <ul id="listaDetalles"></ul>

    <div class="input-container">
      <label for="numero_mfg">Asignar Número MFG:</label>
      <input type="text" id="numero_mfg" placeholder="Escribe el código MFG aquí...">
    </div>

    <div class="botones-container">
      <button class="btn-guardar" onclick="guardarMFG()">💾 Guardar y Finalizar</button>
    </div>
  </div>

  <script>
    const id = localStorage.getItem("asignacion_id");
    if (!id) {
      window.location.href = 'asignacion_mfg.html';
    }

    async function cargarDetalle() {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/refaccion/${id}/`);
        const data = await res.json();

        document.getElementById("tituloDescripcion").textContent = data.descripcion || "Sin descripción";

        const ul = document.getElementById("listaDetalles");
        ul.innerHTML = `
          <li><strong>ID:</strong> ${data.id}</li>
          <li><strong>Solicitado por:</strong> ${data.nombre_solicitante}</li>
          <li><strong>No. Parte Proveedor:</strong> ${data.numero_parte_proveedor}</li>
          <li><strong>Marca:</strong> ${data.marca_proveedor || 'N/A'}</li>
          <li><strong>Familia:</strong> ${data.familia || 'N/A'}</li>
          <li><strong>Aprobación Planta:</strong> ${data.aprobacion_planta}</li>
        `;

      } catch (err) {
        alert("Error al cargar detalle");
      }
    }

    async function guardarMFG() {
      const mfg = document.getElementById("numero_mfg").value.trim();
      if (!mfg) {
        alert("Por favor escribe un Número MFG");
        return;
      }

      const confirmacion = confirm(`¿Asignar MFG: "${mfg}" a esta refacción?`);
      if (!confirmacion) return;

      try {
        const res = await fetch(`http://127.0.0.1:8000/api/asignar_mfg/${id}/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numero_mfg: mfg })
        });

        const respData = await res.json();

        if (res.ok) {
          alert(respData.mensaje);
          window.location.href = 'asignacion_mfg.html';
        } else {
          alert("Error: " + respData.error);
        }
      } catch (err) {
        alert("Error de conexión");
      }
    }

    cargarDetalle();
  </script>

</body>
</html>
