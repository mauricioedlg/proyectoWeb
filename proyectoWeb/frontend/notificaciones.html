<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Notificaciones</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
      background-color: purple;
      color: white;
    }
    header {
      margin-bottom: 20px;
    }
    button.volver {
      background: #4B0082;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.volver:hover {
      background: #360062;
    }
    h2 { margin-bottom: 10px; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: #7c007c;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #4B0082;
    }
    
    /* Filas no leídas en negrita o color más brillante */
    .no-leido {
      font-weight: bold;
      background-color: #9f009f;
    }
    .leido {
      opacity: 0.8;
    }

    tbody tr:hover {
      background: #b300b3;
      cursor: pointer;
    }
    .no-data {
      margin-top: 20px;
      color: #ffd966;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <header>
    <button class="volver" onclick="window.location.href='bienvenida.html'">← Menú Principal</button>
  </header>

  <h2>Mis Notificaciones</h2>

  <div id="mensaje" class="no-data" style="display:none;">No tienes notificaciones.</div>

  <table id="tablaNotif">
    <thead>
      <tr>
        <th>Mensaje</th>
        <th>Fecha</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function cargarNotificaciones() {
      const usuarioId = localStorage.getItem("usuarioId");
      const tbody = document.querySelector("#tablaNotif tbody");
      const mensaje = document.getElementById("mensaje");
      const tabla = document.getElementById("tablaNotif");
      tbody.innerHTML = "";

      try {
        const res = await fetch(`http://127.0.0.1:8000/api/notificaciones/${usuarioId}/`);
        const data = await res.json();

        if (data.length === 0) {
          tabla.style.display = "none";
          mensaje.style.display = "block";
          return;
        }

        tabla.style.display = "table";
        mensaje.style.display = "none";

        data.forEach(n => {
          const tr = document.createElement("tr");
          // Estilo visual si no está leída
          tr.className = n.leido ? 'leido' : 'no-leido';

          tr.innerHTML = `
            <td>${n.mensaje}</td>
            <td>${new Date(n.fecha).toLocaleString()}</td>
            <td>${n.leido ? 'Leído' : 'NUEVO'}</td>
          `;

          // Al hacer click: 1. Marcar leido, 2. Redirigir
          tr.onclick = async () => {
             // Marcar como leído
             await fetch(`http://127.0.0.1:8000/api/notificaciones/leer/${n.id}/`, { method: 'POST' });
             
             // Redirigir
             if (n.url_destino) {
                 window.location.href = n.url_destino;
             } else {
                 // Si no tiene destino, recargar para ver que ya está leída
                 cargarNotificaciones();
             }
          };

          tbody.appendChild(tr);
        });

      } catch (err) {
        alert("Error cargando notificaciones");
      }
    }

    cargarNotificaciones();
  </script>

</body>
</html>
