<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cotizar Refacción</title>
  <style>
    body { font-family: Arial; margin: 30px; background-color: purple; color: white; }
    .card { background: #4B0082; padding: 30px; border-radius: 8px; max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #ffd966; border-bottom: 2px solid #660066; padding-bottom: 10px; }
    ul { list-style-type: disc; padding-left: 20px; font-size: 18px; line-height: 1.6; }
    li strong { color: #e0e0e0; }
    .botones-container { display: flex; justify-content: center; margin-top: 30px; }
    button { padding: 15px 30px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    
    .btn-cotizar { background-color: #28a745; color: white; } /* Verde */
    .btn-cotizar:hover { background-color: #218838; }

    .btn-volver { background-color: #6c757d; color: white; margin-bottom: 20px; }
  </style>
</head>
<body>
  <button class="btn-volver" onclick="window.location.href='cotizaciones_pendientes.html'">← Volver</button>

  <div class="card">
    <h1 id="tituloDescripcion">Cargando...</h1>
    <ul id="listaDetalles"></ul>

    <div class="botones-container">
      <button class="btn-cotizar" onclick="cotizar()">💲 COTIZAR</button>
    </div>
  </div>

  <script>
    const id = localStorage.getItem("cotizacion_id");
    if (!id) window.location.href = 'cotizaciones_pendientes.html';

    async function cargarDetalle() {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/refaccion/${id}/`);
        const data = await res.json();
        document.getElementById("tituloDescripcion").textContent = data.descripcion;
        
        const ul = document.getElementById("listaDetalles");
        ul.innerHTML = `
          <li><strong>ID:</strong> ${data.id}</li>
          <li><strong>MFG:</strong> ${data.numero_mfg}</li>
          <li><strong>Solicitado por:</strong> ${data.nombre_solicitante}</li>
          <li><strong>No. Parte:</strong> ${data.numero_parte_proveedor}</li>
          <li><strong>Marca:</strong> ${data.marca_proveedor || 'N/A'}</li>
          <li><strong>Familia:</strong> ${data.familia || 'N/A'}</li>
          <li><strong>Cantidad:</strong> ${data.cantidad || 0} ${data.unidad}</li>
          <li><strong>Observación:</strong> ${data.observacion || 'N/A'}</li>
        `;
      } catch (err) { alert("Error al cargar detalle"); }
    }

    async function cotizar() {
      const confirmacion = confirm("¿Confirmar que esta refacción ha sido COTIZADA?");
      if (!confirmacion) return;

      try {
        const res = await fetch(`http://127.0.0.1:8000/api/realizar_cotizacion/${id}/`, {
          method: 'POST'
        });
        const data = await res.json();
        if (res.ok) {
          alert(data.mensaje);
          window.location.href = 'cotizaciones_pendientes.html';
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) { alert("Error de conexión"); }
    }
    cargarDetalle();
  </script>
</body>
</html>
