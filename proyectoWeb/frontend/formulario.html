<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alta de Refacciones</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
      background-color: purple; /* Fondo morado */
      color: white;             /* Texto blanco */
    }
    header {
      margin-bottom: 20px;
    }
    button.volver {
      background: #4B0082;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.volver:hover {
      background: #360062;
    }
    form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    form input {
      display: block;
      margin: 5px 0 15px 0;
      padding: 8px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    form button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #4B0082;
      color: white;
      border: none;
      cursor: pointer;
    }
    form button:hover {
      background: #360062;
    }
  </style>
</head>
<body>
  <header>
    <button class="volver" onclick="window.location.href='bienvenida.html'">← Menú Principal</button>
  </header>

  <h2>Registrar Refacción</h2>
  <form id="formRefaccion">
    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" name="descripcion">

    <label for="costo">Costo</label>
    <input type="number" id="costo" name="costo" step="0.01">

    <label for="area">Área</label>
    <input type="text" id="area" name="area">

    <label for="consumo">Consumo</label>
    <input type="text" id="consumo" name="consumo">

    <label for="frecuencia">Frecuencia</label>
    <input type="text" id="frecuencia" name="frecuencia">

    <label for="unidad">Unidad</label>
    <input type="text" id="unidad" name="unidad">

    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" name="cantidad">

    <label for="observacion">Observación</label>
    <input type="text" id="observacion" name="observacion">

    <label for="numero_parte_proveedor">Número parte proveedor</label>
    <input type="text" id="numero_parte_proveedor" name="numero_parte_proveedor" required>

    <label for="marca_proveedor">Marca proveedor</label>
    <input type="text" id="marca_proveedor" name="marca_proveedor">

    <label for="equipos_a_usar">Equipos a usar</label>
    <input type="text" id="equipos_a_usar" name="equipos_a_usar">

    <label for="familia">Familia</label>
    <input type="text" id="familia" name="familia">

    <label for="reemplazable">Reemplazable</label>
    <input type="text" id="reemplazable" name="reemplazable">

    <label for="reduce_velocidad">Reduce velocidad</label>
    <input type="text" id="reduce_velocidad" name="reduce_velocidad">

    <label for="existe_riesgo">Existe riesgo</label>
    <input type="text" id="existe_riesgo" name="existe_riesgo">

    <label for="nacionalidad">Nacionalidad</label>
    <input type="text" id="nacionalidad" name="nacionalidad">

    <label for="pagina_web">Página web</label>
    <input type="text" id="pagina_web" name="pagina_web">

    <button type="submit">Guardar</button>
  </form>

  <script>
    document.getElementById('formRefaccion').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuarioId = localStorage.getItem('usuarioId');
      if (!usuarioId) {
        alert("Debes iniciar sesión primero");
        window.location.href = "index.html";
        return;
      }

      const formData = Object.fromEntries(new FormData(e.target).entries());
      formData.usuario_id = usuarioId;

      const response = await fetch('http://127.0.0.1:8000/api/refacciones/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });

      const data = await response.json();
      alert(data.mensaje || data.error);
      if (response.ok) e.target.reset();
    });
  </script>
</body>
</html>
